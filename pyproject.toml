[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "brainvision"
version = "0.1.0"
description = "Hyperspectral image classification for intraoperative brain tumour detection"
requires-python = ">=3.10"
dependencies = [
    "numpy>=2.0",
    "spectral>=0.24",
    "matplotlib>=3.9",
    "scipy>=1.14",
    "scikit-learn>=1.5",
    "einops>=0.8",
    "torch>=2.0",
    "torchinfo>=1.8",
    "prettytable>=3.18",
]

[project.optional-dependencies]
dev = ["pysptools>=0.15.0"]

[tool.setuptools.packages.find]
include = ["brainvision*"]
